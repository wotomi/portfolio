<svg width="1200" height="1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Animated fractal noise filter -->
    <filter id="animatedNoise" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.9"
        numOctaves="5"
        seed="2"
        stitchTiles="stitch">
        <animate
          attributeName="baseFrequency"
          values="0.9;1.1;0.85;1.05;0.9"
          dur="15s"
          repeatCount="indefinite"/>
        <animate
          attributeName="seed"
          values="2;8;15;5;2"
          dur="20s"
          repeatCount="indefinite"/>
      </feTurbulence>
      <feColorMatrix type="saturate" values="0.3"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.8"/>
      </feComponentTransfer>
    </filter>

    <!-- Organic grain pattern -->
    <filter id="organicGrain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence
        type="turbulence"
        baseFrequency="1.4"
        numOctaves="4"
        seed="10"
        stitchTiles="stitch">
        <animate
          attributeName="baseFrequency"
          values="1.4;1.6;1.3;1.5;1.4"
          dur="12s"
          repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" scale="8">
        <animate
          attributeName="scale"
          values="8;12;6;10;8"
          dur="18s"
          repeatCount="indefinite"/>
      </feDisplacementMap>
    </filter>

    <!-- Animated mesh gradient -->
    <radialGradient id="plasmaGlow1" cx="30%" cy="30%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.15">
        <animate attributeName="stop-opacity" values="0.15;0.25;0.12;0.20;0.15" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="60%" stop-color="#8b5cf6" stop-opacity="0.05">
        <animate attributeName="stop-opacity" values="0.05;0.08;0.03;0.06;0.05" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
      <animateTransform
        attributeName="gradientTransform"
        type="translate"
        values="0 0; -0.05 -0.03; 0.03 0.04; -0.02 0.02; 0 0"
        dur="25s"
        repeatCount="indefinite"/>
    </radialGradient>

    <radialGradient id="plasmaGlow2" cx="70%" cy="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.12">
        <animate attributeName="stop-opacity" values="0.12;0.20;0.10;0.16;0.12" dur="14s" repeatCount="indefinite"/>
      </stop>
      <stop offset="55%" stop-color="#fbbf24" stop-opacity="0.04">
        <animate attributeName="stop-opacity" values="0.04;0.07;0.02;0.05;0.04" dur="14s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
      <animateTransform
        attributeName="gradientTransform"
        type="translate"
        values="0 0; 0.04 -0.02; -0.03 0.05; 0.02 -0.03; 0 0"
        dur="30s"
        repeatCount="indefinite"/>
    </radialGradient>

    <radialGradient id="plasmaGlow3" cx="50%" cy="80%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.14">
        <animate attributeName="stop-opacity" values="0.14;0.22;0.11;0.18;0.14" dur="18s" repeatCount="indefinite"/>
      </stop>
      <stop offset="58%" stop-color="#10b981" stop-opacity="0.04">
        <animate attributeName="stop-opacity" values="0.04;0.06;0.02;0.05;0.04" dur="18s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
      <animateTransform
        attributeName="gradientTransform"
        type="translate"
        values="0 0; -0.04 0.03; 0.05 -0.04; -0.02 0.02; 0 0"
        dur="22s"
        repeatCount="indefinite"/>
    </radialGradient>
  </defs>

  <!-- Base layer -->
  <rect width="100%" height="100%" fill="#0a0a0a"/>

  <!-- Animated plasma gradients -->
  <rect width="100%" height="100%" fill="url(#plasmaGlow1)"/>
  <rect width="100%" height="100%" fill="url(#plasmaGlow2)"/>
  <rect width="100%" height="100%" fill="url(#plasmaGlow3)"/>

  <!-- Animated grain overlay -->
  <rect width="100%" height="100%" filter="url(#animatedNoise)" opacity="0.5"/>

  <!-- Organic texture layer -->
  <rect width="100%" height="100%" filter="url(#organicGrain)" opacity="0.15"/>
</svg>
